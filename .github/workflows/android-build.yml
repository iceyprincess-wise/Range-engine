name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          # pnpm 9 cannot do a frozen install from this lockfile
          # (ERR_PNPM_LOCKFILE_CONFIG_MISMATCH on overrides, proven
          # 2026-11-07); pnpm 10 installs it frozen with no diff.
          version: 10
          
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          
      - name: Install Dependencies
        working-directory: ./artifacts/mockup-sandbox
        run: pnpm install --frozen-lockfile
        
      - name: Build Web Assets
        working-directory: ./artifacts/mockup-sandbox
        env:
          PORT: 5173
          BASE_PATH: /
          # The APK bundle is served by Capacitor's local server, which
          # has no /api proxy (the vite dev proxy only exists in
          # `pnpm dev`). A relative base ("/") makes every API call
          # 404 inside the app, so the APK mounts but can never load
          # data. Point at the deployed api-server (same backend the
          # Render web UI uses; CORS is wide open).
          VITE_API_BASE: https://range-engine-v3.onrender.com
        run: pnpm run build
        
      - name: Sync Capacitor Android
        working-directory: ./artifacts/mockup-sandbox
        run: pnpm exec cap sync android

      - name: Unit Tests
        working-directory: ./artifacts/mockup-sandbox/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest
        
      - name: Compile APK
        working-directory: ./artifacts/mockup-sandbox/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload Final APK
        uses: actions/upload-artifact@v4
        with:
          name: Splendor-Hub-App
          path: artifacts/mockup-sandbox/android/app/build/outputs/apk/debug/app-debug.apk
